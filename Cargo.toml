[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.82"
license = "GPL-3.0-only"
repository = "https://github.com/o2csi/candeo"

[workspace.dependencies]
candeo-protocol = { path = "crates/candeo-protocol" }
candeo-device   = { path = "crates/candeo-device" }
hidapi    = "2.6"
thiserror = "2"
serde     = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Dependencies are optimised even in debug. Our own code is not: we want to
# keep a usable debugger where we write.
#
# The reason is not build comfort, it is **the accuracy of the preview**.
# QuickJS comes in through `rquickjs-sys`, which compiles C at the current
# profile's optimisation level: unoptimised, the same effect takes 6.3 ms per
# frame instead of 0.23 ms — measured, a factor of 25. Yet the whole design
# rests on "the preview IS production": an effect judged smooth or sluggish
# under `tauri dev` must behave the same once installed. Without this line,
# that is false, and what we judge in development is not what we ship.
#
# The price is a longer first build of the dependencies, paid once then
# cached. `hidapi` compiles C too and benefits from it.
[profile.dev.package."*"]
opt-level = 2