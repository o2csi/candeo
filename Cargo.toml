[workspace]
resolver = "2"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
repository = "https://github.com/oorabona/candeo"

[workspace.dependencies]
candeo-protocol = { path = "crates/candeo-protocol" }
candeo-device   = { path = "crates/candeo-device" }
hidapi    = "2.6"
thiserror = "2"
serde     = { version = "1", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
strip = true