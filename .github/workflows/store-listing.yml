name: store-listing

# Sends packaging/store/listing-*.md and packaging/store/screenshots/ to the
# Microsoft Store between releases, without a new package: v0.22.0 shipped with
# a listing that did not name its features, and waiting for the next release
# would have left them unsaid.
#
# packaging/store/submit-listing.mjs does it through Partner Center's API: a
# submission created from the last published one, the texts and screenshots
# written into it, committed for certification. What's new stays the one the
# release sent. A dry run does everything but the commit, then deletes its
# draft. docs/releasing.md says when to use it.
run-name: store-listing ${{ inputs.tag }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release the Store has now, such as v0.22.0"
        required: true
      dry_run:
        description: "Create, fill and delete a draft, without submitting"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: candeo-store
  cancel-in-progress: false

jobs:
  listing:
    if: vars.STORE_PRODUCT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The listings as main has them; the tags, for What's new.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - name: Send the listings and screenshots
        env:
          TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
          TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git rev-parse --verify --quiet "refs/tags/$TAG" > /dev/null || {
            echo "::error::No tag $TAG."
            exit 1
          }
          if [ "$DRY_RUN" = "true" ]; then
            node packaging/store/submit-listing.mjs "$TAG" --dry-run
          else
            node packaging/store/submit-listing.mjs "$TAG"
            echo "The listings and screenshots of main were submitted to the Store, What's new as $TAG sent it." >> "$GITHUB_STEP_SUMMARY"
          fi
