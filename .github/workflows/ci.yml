name: CI

on:
  push: { branches: [main] }
  pull_request:
  # Permet de lancer le job `linux` à la demande sur une branche donnée, sans
  # attendre la fusion. Voir la condition portée par ce job.
  workflow_dispatch:

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # Guillemets indispensables : en notation compacte, la virgule sépare deux
      # clés. `{ components: rustfmt, clippy }` donnait `components: rustfmt`
      # plus une entrée parasite `clippy`, et clippy n'était installé que parce
      # que l'image du coureur le contient déjà.
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # Tout l'espace de travail, et non les deux seules crates sans Tauri :
      # les effets livrés avec l'application sont du JavaScript compilé dans le
      # binaire, et leurs tests — chargement, taille d'image, image non noire —
      # vivent dans `candeo-desktop`. Les laisser hors de l'intégration continue
      # reviendrait à découvrir un effet intégré cassé chez l'utilisateur qui
      # l'ouvre en premier. Le job `build` compile cette crate mais n'exécute
      # aucun test.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Tout le développement se fait sous Windows, et personne n'a de machine Linux
  # dans la boucle : sans ce job, la portabilité ne serait qu'une intention. Il
  # établit ce qu'aucune relecture ne peut établir — que la dorsale `hidraw`
  # d'`hidapi` se construit, que rien dans l'espace de travail ne dépend de
  # Windows, et que la règle udev atterrit vraiment dans le paquet.
  #
  # Ce qu'il ne prouve pas, et ne peut pas prouver : qu'un clavier réponde. Il
  # n'y a pas d'USB derrière un coureur GitHub.
  # Pas sur les propositions de fusion : ce job coûte un quart d'heure, dont une
  # dizaine de minutes passées à recompresser un `.rpm` de débogage (voir plus
  # bas). Le développement se fait sous Windows, et un Linux est disponible en
  # local via WSL — payer ce prix à chaque itération n'achète rien.
  #
  # Il reste **obligatoire sur `main`** : c'est le seul endroit qui atteste que
  # la règle udev est réellement livrée par les paquets. Le filet se déplace donc
  # de « avant la fusion » à « juste après », et `workflow_dispatch` permet de le
  # lancer sur une branche quand un changement touche l'empaquetage, les I/O HID
  # ou les dépendances système.
  linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      # Liste de Tauri 2 pour Debian, plus trois ajouts : `libudev-dev`, qu'une
      # dorsale `hidapi` résout par pkg-config quelle qu'elle soit ; `pkg-config`
      # lui-même ; et `rpm`, pour relire le paquet produit — aucun des trois
      # n'est préinstallé sur l'image.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libudev-dev build-essential pkg-config file rpm
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      # `tauri build` construit le front lui-même par `beforeBuildCommand` ; il
      # ne manque que `node_modules`. `cargo check`, lui, n'a besoin de rien :
      # `tauri-build` se contente d'un `frontendDist` absent — c'est pourquoi le
      # job `rust`, sous Windows, compile `candeo-desktop` sans jamais voir pnpm.
      - run: pnpm install --frozen-lockfile
      - run: cargo check --workspace --all-targets
      # Aucun test ne touche au matériel. Les rejouer ici vérifie que la
      # validation des identifiants et le moteur `rquickjs` se comportent de la
      # même façon sur un système de fichiers sensible à la casse.
      - run: cargo test --workspace
      # Empaquetage en profil `debug` : on ne mesure pas le binaire, on lit le
      # contenu du paquet. Le profil `release` (lto, codegen-units = 1) coûterait
      # plusieurs minutes pour la même preuve. AppImage est écarté — il télécharge
      # ses propres outils, ce qui n'ajoute rien ici et casse sans prévenir.
      #
      # Le prix est connu et mesuré : le `.deb` sort en une dizaine de secondes,
      # le `.rpm` demande une dizaine de minutes — il recompresse un binaire de
      # débogage non dépouillé. C'est ce qui fait la durée du job. On le paie
      # parce que `deb` et `rpm` sont deux déclarations distinctes dans
      # `tauri.conf.json` : ne vérifier que la première laisserait la seconde se
      # tromper en silence.
      - run: pnpm --filter @candeo/desktop exec tauri build --debug --bundles deb,rpm
      # La preuve : la règle est dans les deux paquets, à l'emplacement attendu.
      # On lit les paquets produits — sans cela, `bundle.linux.*.files` resterait
      # une déclaration que rien ne confronte au résultat.
      - name: La règle udev est livrée par les paquets
        run: |
          regle='usr/lib/udev/rules.d/60-candeo.rules'
          dpkg-deb -c "$(ls target/debug/bundle/deb/*.deb | head -1)" | grep -F "$regle"
          rpm -qpl "$(ls target/debug/bundle/rpm/*.rpm | head -1)" | grep -F "/$regle"

  # Avis de sécurité des dépendances Rust. Séparé du job `rust` pour que
  # l'apparition d'un avis ne masque pas une régression de code.
  audit:
    runs-on: ubuntu-latest
    # `rustsec/audit-check` publie son verdict dans un check run dès qu'il a
    # quelque chose à signaler. Sans `checks: write` la création répond 403,
    # et l'action se trompe de diagnostic : elle teste `GITHUB_HEAD_REF` pour
    # savoir si elle tourne depuis un fork, or cette variable est renseignée
    # pour *toute* pull request. Sur une PR elle retombait donc sur un message
    # trompeur — « executed from the forked repository » — et sur un push vers
    # `main`, où la variable est vide, elle relançait l'erreur et faisait
    # échouer le job. C'est la cause des CI rouges sur `main`.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      # 6 min 08 de job, dont 6 de compilation : `rustsec/audit-check` appelle
      # `findOrInstall("cargo-audit")`, qui cherche d'abord le binaire dans le
      # PATH et ne lance `cargo install` qu'à défaut. On le lui fournit donc
      # déjà installé, depuis les binaires officiels publiés par RustSec —
      # quelques secondes, somme de contrôle vérifiée. Rien n'est affaibli :
      # même outil, même `.cargo/audit.toml`, et la base d'avis est de toute
      # façon retéléchargée à chaque exécution.
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - uses: rustsec/audit-check@v2.0.0
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # La version de pnpm vient du champ `packageManager` de package.json :
      # une seule source de vérité, locale et en intégration continue.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @candeo/desktop exec vue-tsc --noEmit

  # Seul job qui construit réellement l'application. `fmt`, `clippy`, les tests
  # et `vue-tsc` ne compilent jamais `candeo-desktop` : une rupture de la
  # liaison Tauri — commande renommée, `invoke` sans destinataire, plugin mal
  # déclaré — ne se voyait donc qu'à la main.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Cache distinct de celui du job `rust` : le profil `release` (lto,
      # codegen-units = 1) ne partage aucun artefact avec les tests en debug.
      # L'écriture est réservée à `main` : une branche ne peut relire que le
      # cache de sa base, et les caches de PR ne feraient qu'évincer celui dont
      # tout le monde repart.
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/main' }}" }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `tauri build` enchaîne `beforeBuildCommand` (vue-tsc puis vite build),
      # la compilation Rust en release, et l'empaquetage MSI et NSIS.
      - run: pnpm --filter @candeo/desktop exec tauri build
      # Le binaire nu pour un essai immédiat, les installeurs pour une
      # installation complète. `error` plutôt que le défaut `warn` : un
      # empaquetage qui ne produit rien est un échec, pas un avertissement.
      - uses: actions/upload-artifact@v7
        with:
          name: candeo-windows
          path: |
            target/release/*.exe
            target/release/bundle/**
          if-no-files-found: error
