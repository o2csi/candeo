name: CI

# A private repository's minutes are billed, and this file spends them. Three
# safeguards are set here, after a day of 60 runs that used up the quota and
# cut Actions off.
on:
  push: { branches: [main] }
  pull_request:
    # A change that touches only prose breaks neither the build, nor the tests,
    # nor the packaging. Several pull requests on a single day are purely
    # editorial — a protocol survey, the README, design documents — and used to
    # set off the whole run.
    #
    # ⚠️ Filters pull requests ONLY. On `main`, everything runs: that is where
    # the caches are saved, and a `main` that skipped runs would let the caches
    # go stale.
    paths-ignore: ["**/*.md", "docs/**", "LICENSE*"]
  # Lets the `linux` job run on demand on a given branch, without waiting for
  # the merge. See the condition that job carries.
  workflow_dispatch:

# A run made obsolete by the next one no longer proves anything, and costs just
# as much. A single pull request often gets three or four pushes, and every
# superseded run went all the way to the end.
#
# ⚠️ Never on `main`: a cancelled run **does not save its cache**, and two
# merges close together would be enough never to write a single one. That is
# exactly the mechanism that already froze the `rust` job's cache for half a
# day.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read only: no job here writes to the repository. Actions are pinned to a commit
# rather than a movable tag, and dependabot updates the pins.
permissions:
  contents: read

jobs:
  # ⚠️ On Ubuntu, no longer Windows — this is the heaviest item in the file,
  # and the Windows runner is **billed double**.
  #
  # What we keep: nothing here is specific to one system. `fmt` and `clippy`
  # read code, and no test touches the hardware — there is no USB behind a
  # GitHub runner, whatever its system.
  #
  # What we lose, named rather than passed over in silence: the tests no longer
  # run on Windows for every pull request. The Windows **build**, for its part,
  # is still proven by the `build` job, which builds the whole application in
  # `release`. And development happens on Windows: these tests run there
  # locally all the time, which is precisely the one place where a divergence
  # in paths would show first.
  #
  # If a Windows-specific regression ever slipped through, the answer is a
  # scheduled or on-demand run — not a runner billed double on every push.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The quotes are required: in compact notation, the comma separates two
      # keys. `{ components: rustfmt, clippy }` gave `components: rustfmt` plus
      # a stray `clippy` entry, and clippy was installed only because the
      # runner image already contains it.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with: { components: "rustfmt, clippy" }
      # `rust-cache` bases its key on `Cargo.lock` and the toolchain — **not**
      # on the build profiles. When `[profile.dev.package."*"]` moved to
      # `opt-level = 2` without `Cargo.lock` changing, the key therefore did not
      # change: every run restored unoptimised dependencies, recompiled them
      # all, then gave up on saving — key already present, hence "Cache
      # up-to-date". A stale cache that nothing replaces, and a job that went
      # from 2 to 30 minutes without the cache seeming to be the cause.
      #
      # The hash of the root `Cargo.toml` closes the gap: it is the only file
      # where cargo reads the profiles, so touching a profile opens a fresh
      # namespace, paid for once then reused. Do not remove it, taking it for
      # noise — this key is all that ties the cache to the profiles.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with: { key: "${{ hashFiles('Cargo.toml') }}" }
      # `clippy --all-targets` compiles `candeo-desktop`, and so links
      # webkit2gtk: without these packages, it fails at link time, not at
      # analysis. Same list as the `linux` job, minus `rpm` — nothing is
      # packaged here.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libudev-dev build-essential pkg-config file
      - run: cargo fmt --all -- --check
      # The whole workspace, not only the two crates without Tauri: the effects
      # shipped with the application are JavaScript compiled into the binary,
      # and their tests — loading, frame size, a frame that is not black — live
      # in `candeo-desktop`. Leaving them out of continuous integration would
      # mean finding a broken built-in effect at the first user who opens it.
      # The `build` job compiles this crate but runs no test.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # All development happens on Windows, and nobody has a Linux machine in the
  # loop: without this job, portability would be no more than an intention. It
  # establishes what no review can — that the `hidraw` backend of `hidapi`
  # builds, that nothing in the workspace depends on Windows, and that the udev
  # rule really lands in the package.
  #
  # What it does not prove, and cannot prove: that a keyboard answers. There is
  # no USB behind a GitHub runner.
  # Not on pull requests: this job costs a quarter of an hour, about ten minutes
  # of it spent recompressing a debug `.rpm` (see below). Development happens
  # on Windows, and a Linux is available locally through WSL — paying that
  # price on every iteration buys nothing.
  #
  # It stays **mandatory on `main`**: that is the only place that attests the
  # udev rule is really shipped by the packages. The safety net therefore moves
  # from "before the merge" to "just after", and `workflow_dispatch` lets it
  # run on a branch when a change touches packaging, HID I/O or system
  # dependencies.
  linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # Same profile-hash key as the `rust` job, and for the same reason: this
      # job also compiles in debug, so under `[profile.dev.package."*"]`.
      # Expanded notation, not compact — two keys whose values already carry
      # quotes, which is where this file got caught once.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: "${{ github.ref == 'refs/heads/main' }}"
          key: "${{ hashFiles('Cargo.toml') }}"
      # Tauri 2's list for Debian, plus three additions: `libudev-dev`, which
      # every `hidapi` backend resolves through pkg-config, whichever it is;
      # `pkg-config` itself; and `rpm`, to read the produced package back —
      # none of the three is preinstalled on the image.
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            libudev-dev build-essential pkg-config file rpm
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      # `tauri build` builds the front end itself through `beforeBuildCommand`;
      # only `node_modules` is missing. `cargo check`, for its part, needs
      # nothing: `tauri-build` makes do with a missing `frontendDist` — which is
      # why the `rust` job, on Windows, compiles `candeo-desktop` without ever
      # seeing pnpm.
      - run: pnpm install --frozen-lockfile
      # Neither `cargo check` nor `cargo test` here: since the `rust` job moved
      # to Ubuntu, it has already run them **on this same system**, including
      # the case sensitivity of the file system that was the argument for
      # running them again. Redoing them would cost the compile time twice for
      # the same proof.
      #
      # This job therefore keeps what it alone establishes: that the application
      # **packages**, and that the udev rule is in the packages produced.
      # Packaging in the `debug` profile: we do not measure the binary, we read
      # the package's contents. The `release` profile (lto, codegen-units = 1)
      # would cost several minutes for the same proof. AppImage is left out — it
      # downloads its own tools, which adds nothing here and breaks without
      # warning.
      #
      # The price is known and measured: the `.deb` comes out in about ten
      # seconds, the `.rpm` takes about ten minutes — it recompresses an
      # unstripped debug binary. That is what makes the job's duration. We pay
      # it because `deb` and `rpm` are two separate declarations in
      # `tauri.conf.json`: checking only the first would let the second go
      # wrong in silence.
      - run: pnpm --filter @candeo/desktop exec tauri build --debug --bundles deb,rpm
      # The proof: the rule is in both packages, at the expected location. The
      # packages produced are read — without that, `bundle.linux.*.files` would
      # remain a declaration that nothing holds up against the result.
      - name: La règle udev est livrée par les paquets
        run: |
          regle='usr/lib/udev/rules.d/60-candeo.rules'
          dpkg-deb -c "$(ls target/debug/bundle/deb/*.deb | head -1)" | grep -F "$regle"
          rpm -qpl "$(ls target/debug/bundle/rpm/*.rpm | head -1)" | grep -F "/$regle"

  # Security advisories for the Rust dependencies. Kept apart from the `rust`
  # job so that a new advisory does not hide a code regression.
  audit:
    runs-on: ubuntu-latest
    # Read only: nothing here creates a check run any more since `cargo audit`
    # is called directly. The record of what `checks: write` cost stays,
    # because the day we go back to `rustsec/audit-check`, the failure comes
    # back with it. Without that permission, creating the check run answers
    # 403, and the action gets the diagnosis wrong: it tests `GITHUB_HEAD_REF`
    # to find out whether it runs from a fork, yet that variable is set for
    # *every* pull request. On a PR it therefore fell back on a misleading
    # message — "executed from the forked repository" — and on a push to
    # `main`, where the variable is empty, it rethrew the error and failed the
    # job. That is the cause of the red CI runs on `main`.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Official binaries published by RustSec, checksum verified: a few
      # seconds, where letting `cargo install cargo-audit` compile the tool
      # cost six of the job's 6 min 08.
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with: { tool: cargo-audit }
      # A direct call rather than `rustsec/audit-check@v2.0.0`: the wrapper runs
      # on a deprecated Node.js 20, which GitHub already forces onto Node 24
      # and will end up cutting off. Upstream fixed it — "Update to use Node
      # 24", 2026-03-20 — but never released it: the latest version is still
      # v2.0.0 from September 2024, the `v2` branch stayed on that commit, and
      # there is no newer tag. There was therefore no version to move to, and
      # hanging on to an unreleased commit would have bought the risk of a
      # moving branch without the guarantee of a release.
      #
      # What we lose, and it is the only thing the action brought: the verdict
      # is no longer published in a separate *check run* — "Security audit",
      # readable from the "Checks" tab without opening the log. It is now read
      # in the job's output.
      #
      # What does not change: the same binary — the action only called it —,
      # the same `.cargo/audit.toml`, which carries the RUSTSEC-2024-0429
      # exception, the same advisory database downloaded again on every run,
      # and the "unmaintained" warnings (six to date) stay non-blocking.
      #
      # What tightens, deliberately: the action passed `ignoreReturnCode` and
      # failed the job only on a **critical** severity — a high or moderate
      # vulnerability was only a warning, and the job stayed green. The exit
      # code now decides, so any vulnerability fails it. There is none to date;
      # the day there is one, it gets fixed, or it gets justified and dated in
      # `.cargo/audit.toml`.
      - run: cargo audit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from the `packageManager` field of package.json:
      # a single source of truth, locally and in continuous integration.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @candeo/desktop exec vue-tsc --noEmit
      # Types cannot see a value routed to the wrong place (#67). Node only, no
      # browser: a few seconds on top of the job.
      - run: pnpm --filter @candeo/desktop test

  # The only job that actually builds the application. `fmt`, `clippy`, the
  # tests and `vue-tsc` never compile `candeo-desktop`: a break in the Tauri
  # binding — a renamed command, an `invoke` with no receiver, a plugin
  # declared wrong — was therefore only seen by hand.
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      # A cache separate from the `rust` job's: the `release` profile (lto,
      # codegen-units = 1) shares no artefact with the debug tests. Writing is
      # reserved for `main`: a branch can only read back its base's cache, and
      # PR caches would only evict the one everybody starts from.
      #
      # Same profile hash as the `rust` and `linux` jobs. It was not needed here
      # at the time — only `[profile.dev.package."*"]` had moved, and this job
      # stayed at six minutes while the other two went to thirty — but
      # `[profile.release]` lives in the **same** `Cargo.toml`: the day it
      # changes, this cache would freeze in exactly the same way, and nobody
      # would make the connection a second time.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: "${{ github.ref == 'refs/heads/main' }}"
          key: "${{ hashFiles('Cargo.toml') }}"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # `tauri build` chains `beforeBuildCommand` (vue-tsc then vite build), the
      # Rust release build, and the MSI and NSIS packaging.
      - run: pnpm --filter @candeo/desktop exec tauri build
      # The bare binary for an immediate try, the installers for a full
      # installation. `error` rather than the default `warn`: packaging that
      # produces nothing is a failure, not a warning.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candeo-windows
          path: |
            target/release/*.exe
            target/release/bundle/**
          if-no-files-found: error
