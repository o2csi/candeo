# The project page, at https://o2csi.github.io/candeo/.
#
# It exists because a listing asks for an address — the Microsoft Store's
# website field, winget's `PackageUrl` — and because a privacy policy served as a
# page reads better than a file on a code host. Its privacy page is rendered from
# `PRIVACY.md`, which stays the only copy of that text.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - PRIVACY.md
      - .github/workflows/pages.yml
  # The page names the latest release, so it is rebuilt after one is published.
  workflow_dispatch:

permissions: {}

# One deployment at a time, and a running one is left to finish: a half-uploaded
# site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
