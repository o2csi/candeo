name: Release Please

# Keeps a release pull request open with the next version and its changelog, from
# the Conventional Commits merged into main. Merging it bumps every version file,
# tags the commit, opens a draft release, and calls release.yml, which builds the
# installers and publishes the draft. See docs/releasing.md.
on:
  push:
    branches: [main]

permissions: {}

# Two merges close together must not race on the same release pull request.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # The `autorelease: pending` label is created and set through the issues API.
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      # The commit this push merged, which release-please just tagged.
      ref: ${{ github.sha }}
    # For the Store and winget submissions that follow publishing: a called
    # workflow sees no secret it is not handed.
    secrets: inherit

  # The Store's What's new is gathered at release from packaging/store/news/
  # (#220). Shown on the release pull request, it is read before the merge
  # rather than found missing in Partner Center.
  store-news:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every tag: What's new counts from the previous release.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - name: Show What's new on the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r pr title < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --label "autorelease: pending" --json number,title \
            --jq '.[0] | select(.) | "\(.number) \(.title)"') || true
          [ -n "${pr:-}" ] || exit 0
          # The version it proposes, from its title (`Go release vX.Y.Z 🚀`): the
          # preview then carries the version line and link the release sends.
          version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' <<< "$title" | sed -n 1p || true)
          node packaging/store/listing.mjs --preview $version > "$RUNNER_TEMP/news.md"

          # One comment, edited at each merge rather than added again.
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
            --jq '.[] | select(.body | startswith("<!-- store-news -->")) | .id' | sed -n 1p)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" \
              -F "body=@$RUNNER_TEMP/news.md" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$pr/comments" \
              -F "body=@$RUNNER_TEMP/news.md" > /dev/null
          fi
