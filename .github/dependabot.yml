version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      # The Tauri stack moves as one block: updating it piece by piece
      # produces combinations nobody has tested.
      tauri:
        patterns: ["tauri", "tauri-*", "wry", "tao"]

  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]
      vue:
        patterns: ["vue", "vue-*", "@vitejs/*", "vite"]
    ignore:
      # vue-tsc 3.3 loads `typescript/lib/tsc`, which the native rewrite of
      # TypeScript 7 no longer exposes. Checked on 2026-09-12:
      # ERR_PACKAGE_PATH_NOT_EXPORTED on the first `vue-tsc --noEmit`.
      # To be lifted when vue-tsc supports TS 7.
      - dependency-name: typescript
        versions: [">=7"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
