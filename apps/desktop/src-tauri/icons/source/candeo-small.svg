<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Drawn on a 32 px grid, even coordinates, so 32 and 16 px stay sharp. -->
  <rect width="32" height="32" rx="8" fill="#1b1a22"/>

  <!-- The backlight, below the key only: no blur, which smears at this size. -->
  <rect x="2" y="18" width="28" height="10" rx="5" fill="#f2a33c" fill-opacity="0.35"/>
  <rect x="4" y="20" width="24" height="6" rx="3" fill="#f2a33c"/>

  <!-- The keycap, wider than tall, and its top face. -->
  <rect x="6" y="4" width="20" height="16" rx="4" fill="#4a4760"/>
  <rect x="10" y="6" width="12" height="8" rx="2" fill="#5f5b7a"/>

  <!-- Where the light escapes. -->
  <rect x="6" y="20" width="20" height="2" fill="#ffe8bd"/>
</svg>
