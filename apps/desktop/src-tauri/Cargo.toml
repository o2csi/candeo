[package]
name = "candeo-desktop"
description = "Application de bureau candeo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Le suffixe `_lib` evite un conflit de nom avec le binaire sous Windows.
name = "candeo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
candeo-protocol.workspace = true
candeo-device.workspace = true
hidapi.workspace = true
serde.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde_json = "1"

# Une seule instance à la fois — voir `src/single_instance.rs`. Sans la
# fonctionnalité `semver`, qui laisserait cohabiter deux versions incompatibles :
# ce qui ne se partage pas ici, c'est le clavier et `settings.json`, et ni l'un
# ni l'autre ne s'entend mieux avec un voisin d'une autre version.
tauri-plugin-single-instance = "2"

# Moteur d'effets. `loader` sert à résoudre `@candeo/effects-api` vers un
# module interne, sans bundler ni `node_modules`.
rquickjs = { version = "0.13", features = ["loader"] }

# Journal — voir `src/journal.rs`. `tracing` plutôt que `tauri-plugin-log`, qui
# est première partie et réglerait l'essentiel en quelques lignes : il y a une
# boucle de rendu par appareil, et « écriture refusée » ne sert à rien sans
# savoir laquelle. Un *span* par boucle attache l'appareil et l'effet à tout ce
# qui s'y journalise, sans trimballer un identifiant dans chaque appel.
#
# Ici seulement, et pas dans l'espace de travail : `candeo-protocol` et
# `candeo-device` n'ont aucune dépendance, et c'est ce qui rend leurs tests
# exécutables sans rien installer. Le jour où l'une d'elles voudrait journaliser,
# `tracing` monterait dans `[workspace.dependencies]`.
tracing = "0.1"
# `env-filter` porte la directive et son analyse, `fmt` la mise en forme.
# La recharge à chaud (`reload`) est dans le tronc, sans fonctionnalité à armer.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Rotation quotidienne et nombre de fichiers plafonné : une application
# d'éclairage tourne des jours.
tracing-appender = "0.2"

[dev-dependencies]
# Le stockage se teste dans un dossier temporaire, jamais dans celui de
# l'utilisateur — et sans lancer Tauri.
tempfile = "3"
