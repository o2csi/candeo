[package]
name = "candeo-desktop"
description = "Candeo desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows.
name = "candeo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# The OpenRGB output (#368, docs/design/openrgb-output.md): a proof of concept,
# off by default and wired into nothing yet, so the default build and its
# startup are unchanged.
openrgb = ["dep:candeo-openrgb"]

[dependencies]
candeo-protocol.workspace = true
candeo-device.workspace = true
# Effects from TypeScript to JavaScript, in Rust (#381): see `runtime::compile`.
candeo-compiler.workspace = true
candeo-openrgb = { workspace = true, optional = true }
hidapi.workspace = true
serde.workspace = true
# `tray-icon`: the notification area icon — see `src/tray.rs`. It is not an
# interface nicety, it is what makes the promise "an effect runs with the window
# closed" true: without something that outlives the last window, closing it
# stops the process, and therefore the render threads.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# `preserve_order`: a map keeps the order it was given (`indexmap`, already in the
# tree). An effect's settings are shown in the order it declares them (#177), and
# `settings.json` is written back in the order it was read rather than sorted.
serde_json = { version = "1", features = ["preserve_order"] }

# One instance at a time — see `src/single_instance.rs`. Without the `semver`
# feature, which would let two incompatible versions live side by side: what
# cannot be shared here is the keyboard and `settings.json`, and neither gets
# along any better with a neighbour of another version.
tauri-plugin-single-instance = "2"

# The system notification saying that closing hid the window (`src/tray.rs`).
tauri-plugin-notification = "2"

# Effects engine. `loader` resolves `@candeo/effects-api` to an internal
# module, with no bundler and no `node_modules`.
rquickjs = { version = "0.14", features = ["loader"] }

# Log — see `src/journal.rs`. `tracing` rather than `tauri-plugin-log`, which is
# first-party and would settle most of it in a few lines: there is one render
# loop per device, and "write refused" is of no use without knowing which one.
# One *span* per loop attaches the device and the effect to everything logged
# inside it, without carrying an identifier through every call.
#
# Here only, and not in the workspace: `candeo-protocol` and `candeo-device`
# have no dependencies, and that is what makes their tests runnable without
# installing anything. The day one of them wanted to log, `tracing` would move
# up into `[workspace.dependencies]`.
tracing = "0.1"
# `env-filter` carries the directive and its parsing, `fmt` the formatting.
# Hot reloading (`reload`) is in the core, with no feature to turn on.
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Daily rotation and a capped number of files: a lighting application runs for
# days.
tracing-appender = "0.2"
# Content hash of an effect's source, pairing it with its compiled cache.
# Already in the tree through Tauri.
sha2 = "0.11"
# The local time automations run on (`src/automations/mod.rs`): "on the hour" and
# "between 22:00 and 07:00", daylight saving included. The standard library has
# no time zones. `time`, already in the tree, refuses the local offset in a
# multithreaded process on Linux, which this one is; `clock` alone, for
# `Local::now`.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# When a rule applies (`src/automations/resolver.rs`): cron expressions, five
# fields or six with seconds, found backwards from now across daylight-saving
# changes. One trigger that says "the hour", "weekdays at 9" and "at 22:00", rather
# than a schedule of our own grown one option at a time.
croner = "4"
# The signals API (#108): a blocking HTTP server in a thread of its own, since
# nothing else in the application runs on an async runtime; the interfaces it
# may listen on; and the token's randomness. See `src/signals/`.
tiny_http = "0.12"
if-addrs = "0.15"
getrandom = "0.4"

# The MCP server (#359, `docs/design/mcp-server.md`): rmcp is the official Rust
# SDK, 3.9 the first to implement the 2026-07-28 revision. `server` serves over
# any byte stream, the local pipe included; no HTTP feature, no macros: the
# tools are listed and dispatched by hand, so that an error is always a tool
# result the model can read. See `src/mcp/`.
rmcp = { version = "3.9", default-features = false, features = ["server", "base64"] }
# The tool schemas, from the Rust types: rmcp's own major version.
schemars = "1"
# Already in the tree through Tauri, whose runtime the server runs on: `net` for
# the named pipe and the Unix socket, `io-std` for `candeo --mcp`, which relays
# stdio to the pipe on a runtime of its own.
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = "0.7"

# Key names in the active keyboard layout (`GetKeyNameTextW`, `src/keys.rs`), key
# presses through Raw Input (`src/runtime/presses.rs`) and the display language
# (`src/language.rs`). Already in the tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  # Devices plugged in and unplugged (`src/hotplug.rs`).
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Foundation",
  "Win32_Globalization",
  # The icon in this executable's resources (`src/taskbar.rs`).
  "Win32_System_LibraryLoader",
  # The Windows build in the copied diagnostic (`src/journal.rs`), and the
  # machine's model definitions are matched against (`src/machine.rs`).
  "Win32_System_Registry",
  # Whether this process runs from an MSIX package (`src/msix.rs`).
  "Win32_Storage_Packaging_Appx",
  # The MCP pipe that only the signed-in user can open (`src/mcp/pipe.rs`): the
  # user's SID, and a security descriptor granting it alone.
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
  # How long the session has been idle, with `GetLastInputInfo` (`src/idle.rs`).
  "Win32_System_SystemInformation",
  # What the computer is doing (`src/system/windows.rs`, #242): performance
  # counters, and the GPU's temperature as Task Manager reads it. Neither needs
  # administrator rights nor a driver.
  "Win32_System_Performance",
  "Wdk_Graphics_Direct3D",
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
# Whether Windows' Controlled folder access refused a write to `Documents`
# (`src/controlled_folders.rs`, #394): `MSFT_MpPreference` through WMI, readable
# without administrator rights. `wmi` rather than COM of our own: the locator,
# the proxy security and the VARIANTs are its whole job, on the `windows` crate
# already in the tree; it only adds the `futures` facade, whose parts are there
# too. Without its default `chrono`: no date is read.
wmi = { version = "0.18", default-features = false }
# The `Documents` folder, found as Tauri's `document_dir()` finds it. Already in
# the tree through Tauri.
dirs = "7"

# Launch at login inside an MSIX package (`src/autostart.rs`): there the `Run`
# value goes to a store nothing reads at login, and Windows offers `StartupTask`
# instead. WinRT, which `windows-sys` does not carry. Already in the tree through
# Tauri.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "ApplicationModel",
  "ApplicationModel_Activation",
  "Foundation",
  # The sound playing, through WASAPI loopback (`src/audio/wasapi.rs`, #107):
  # COM interfaces, which `windows-sys` does not carry either.
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
]

# Kernel uevents for devices plugged in and unplugged on Linux (`src/hotplug.rs`),
# and the user id the MCP socket checks its peers against (`src/mcp/pipe.rs`).
# Already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Storage is tested in a temporary folder, never in the user's — and without
# starting Tauri.
tempfile = "3"
# The MCP server is tested through rmcp's own client, over an in-memory stream.
rmcp = { version = "3.9", default-features = false, features = ["server", "base64", "client"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
