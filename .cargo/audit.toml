# Configuration for `cargo audit`.
#
# Every entry here must be justified and dated. An unexplained exception is
# worse than a warning: it is passed on in silence.

[advisories]
ignore = [
    # RUSTSEC-2024-0429 — glib < 0.20: unsound `Iterator` /
    # `DoubleEndedIterator` on `VariantStrIter` (GHSA-wrw7-89jp-8q8g, moderate
    # severity).
    #
    # Why it is ignored, as of 2026-09-12:
    #
    # 1. ~~The code is never compiled.~~ **No longer true since the `linux`
    #    job.** `glib` comes in through the GTK3 stack, which Tauri uses on
    #    Linux only: `cargo tree --invert glib` stays empty on the Windows
    #    target, but the CI `linux` job now compiles that stack, and the deb
    #    and rpm packages it produces ship it. Point 1 has therefore fallen —
    #    2 and 3 remain, and they are enough.
    # 2. No fixed version can be reached. Tauri 2.11.5 — the latest — pins
    #    gtk 0.18; and gtk 0.19, the last published release of gtk3-rs, stays
    #    on glib 0.19, so still within the vulnerable range (< 0.20). The fix
    #    lives in the gtk4 branch, where Tauri is not.
    # 3. We do not call `VariantStrIter`, neither directly nor indirectly.
    #
    # To be reopened as soon as either of the two remaining points stops being
    # true — in practice, as soon as Tauri moves to gtk4 or publishes a glib
    # fix.
    "RUSTSEC-2024-0429",
]
